<!DOCTYPE html><html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#18191a">
  <meta name="description" content="M-EI HO Messenger — discute avec tes amis.">
  <title>M-EI HO Messenger</title>  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>  <style>
    :root {
      --bg: #18191a;
      --card: #242526;
      --card2: #3a3b3c;
      --text: #e4e6eb;
      --muted: #b0b3b8;
      --blue: #0866ff;
      --border: #3e4042;
      --green: #31a24c;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    button, input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .topbar {
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 21px;
      font-weight: bold;
    }

    .brand-logo {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--blue);
      color: white;
      font-size: 23px;
    }

    .top-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .btn {
      border: 0;
      border-radius: 8px;
      padding: 11px 16px;
      font-weight: bold;
      background: var(--blue);
      color: white;
    }

    .btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: var(--card2);
      color: var(--text);
    }

    .page {
      max-width: 1100px;
      margin: 25px auto;
      padding: 0 14px;
    }

    #auth {
      max-width: 430px;
      margin: 55px auto;
      padding: 26px;
      border-radius: 14px;
      background: var(--card);
      box-shadow: 0 5px 20px #0003;
    }

    #auth h2 {
      margin: 0 0 10px;
      font-size: 26px;
    }

    .subtitle {
      color: var(--muted);
      line-height: 1.5;
      margin-bottom: 22px;
    }

    .field {
      width: 100%;
      padding: 14px;
      margin-bottom: 12px;
      border: 1px solid var(--border);
      border-radius: 9px;
      outline: none;
      background: var(--bg);
      color: var(--text);
    }

    .field:focus {
      border-color: var(--blue);
    }

    #submit {
      width: 100%;
      margin-top: 4px;
    }

    #switch {
      display: block;
      margin: 18px auto 0;
      padding: 6px;
      border: 0;
      background: transparent;
      color: #72a7ff;
    }

    #status {
      margin-top: 14px;
      color: #ffbaba;
      font-size: 14px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .app-layout {
      display: grid;
      grid-template-columns: 320px minmax(0, 1fr);
      gap: 16px;
      min-height: 70vh;
    }

    .panel {
      background: var(--card);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .panel-heading {
      padding: 18px;
      font-size: 19px;
      font-weight: bold;
      border-bottom: 1px solid var(--border);
    }

    #search {
      width: calc(100% - 24px);
      margin: 12px;
      padding: 12px;
      border: 0;
      outline: none;
      border-radius: 25px;
      background: var(--card2);
      color: var(--text);
    }

    #users {
      padding: 0 8px 12px;
      max-height: 60vh;
      overflow-y: auto;
    }

    .person {
      padding: 13px 12px;
      margin: 4px 0;
      border-radius: 9px;
      cursor: pointer;
      overflow-wrap: anywhere;
    }

    .person:hover,
    .person.active {
      background: var(--card2);
    }

    .chat-panel {
      display: flex;
      flex-direction: column;
      min-height: 65vh;
    }

    .chat-heading {
      min-height: 65px;
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      font-weight: bold;
      font-size: 18px;
      display: flex;
      align-items: center;
    }

    #messages {
      flex: 1;
      min-height: 350px;
      max-height: 58vh;
      overflow-y: auto;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .welcome {
      color: var(--muted);
      text-align: center;
      margin: auto;
      line-height: 1.6;
    }

    .bubble {
      align-self: flex-start;
      max-width: 80%;
      padding: 10px 13px;
      border-radius: 16px 16px 16px 4px;
      background: var(--card2);
      overflow-wrap: anywhere;
      white-space: pre-wrap;
      line-height: 1.4;
    }

    .bubble.mine {
      align-self: flex-end;
      background: var(--blue);
      color: white;
      border-radius: 16px 16px 4px 16px;
    }

    .message-time {
      display: inline-block;
      margin-top: 4px;
      font-size: 11px;
      opacity: 0.75;
    }

    .message-form {
      display: flex;
      gap: 9px;
      padding: 12px;
      border-top: 1px solid var(--border);
    }

    #message {
      flex: 1;
      min-width: 0;
      padding: 13px;
      border: 0;
      outline: none;
      border-radius: 24px;
      background: var(--card2);
      color: var(--text);
    }

    #sendBtn {
      border-radius: 50%;
      width: 46px;
      height: 46px;
      padding: 0;
      font-size: 20px;
    }

    .bottom-nav {
      display: flex;
      justify-content: center;
      gap: 35px;
      padding: 18px;
      margin-top: 20px;
      color: var(--muted);
      border-top: 1px solid var(--border);
      font-size: 13px;
    }

    .bottom-nav span {
      text-align: center;
    }

    .empty {
      padding: 15px;
      color: var(--muted);
      text-align: center;
      line-height: 1.5;
    }

    [hidden] {
      display: none !important;
    }

    @media (max-width: 700px) {
      .topbar {
        padding: 0 12px;
      }

      .brand {
        font-size: 18px;
      }

      .page {
        margin: 12px auto;
        padding: 0 8px;
      }

      .app-layout {
        grid-template-columns: 1fr;
      }

      #users {
        max-height: 220px;
      }

      .chat-panel {
        min-height: 55vh;
      }

      #messages {
        min-height: 280px;
        max-height: 48vh;
      }

      #auth {
        margin: 35px 8px;
        padding: 22px;
      }

      .bottom-nav {
        gap: 24px;
      }
    }
  </style></head><body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-logo">M</div>
      <span>M-EI HO Messenger</span>
    </div><div class="top-actions">
  <button id="logout" class="btn btn-secondary" style="display:none">
    Déconnexion
  </button>
</div>

  </header>  <main class="page">
    <!-- INSCRIPTION / CONNEXION -->
    <section id="auth">
      <h2 id="authTitle" data-mode="signup">Créer un compte</h2>  <p class="subtitle">
    Bienvenue sur M-EI HO Messenger. Crée ton compte pour commencer à discuter.
  </p>

  <input
    id="name"
    class="field"
    type="text"
    placeholder="Ton nom complet"
    autocomplete="name"
  >

  <input
    id="email"
    class="field"
    type="email"
    placeholder="Adresse e-mail"
    autocomplete="email"
  >

  <input
    id="password"
    class="field"
    type="password"
    placeholder="Mot de passe (6 caractères minimum)"
    autocomplete="new-password"
  >

  <button id="submit" class="btn">Créer mon compte</button>

  <button id="switch" type="button">
    J'ai déjà un compte
  </button>

  <div id="status" role="status" aria-live="polite"></div>
</section>

<!-- APPLICATION -->
<section id="app" hidden>
  <div class="app-layout">
    <aside class="panel">
      <div class="panel-heading">Discussions</div>

      <input
        id="search"
        type="search"
        placeholder="Rechercher un utilisateur..."
        autocomplete="off"
      >

      <div id="users">
        <div class="empty">Chargement des utilisateurs...</div>
      </div>
    </aside>

    <section class="panel chat-panel">
      <div id="chatTitle" class="chat-heading">
        M-EI HO Messenger
      </div>

      <div id="messages" aria-live="polite">
        <div class="welcome">
          Salut ! 👋<br>
          Choisis un utilisateur pour commencer une discussion.
        </div>
      </div>

      <form id="messageForm" class="message-form">
        <input
          id="message"
          type="text"
          placeholder="Écris un message..."
          autocomplete="off"
          maxlength="5000"
          disabled
        >

        <button
          id="sendBtn"
          class="btn"
          type="submit"
          aria-label="Envoyer le message"
          disabled
        >➤</button>
      </form>
    </section>
  </div>
</section>

<nav class="bottom-nav" aria-label="Navigation">
  <span>🏠<br>Accueil</span>
  <span>💬<br>Messages</span>
  <span>👤<br>Profil</span>
  <span>☰<br>Menu</span>
</nav>

  </main>  <script>
    // Connexion des boutons au fichier app.js
    document.getElementById("submit").addEventListener("click", () => {
      if (typeof authenticate === "function") authenticate();
    });

    document.getElementById("switch").addEventListener("click", () => {
      if (typeof toggleMode === "function") toggleMode();
    });

    document.getElementById("logout").addEventListener("click", () => {
      if (typeof logout === "function") logout();
    });

    document.getElementById("search").addEventListener("input", () => {
      if (typeof filterUsers === "function") filterUsers();
    });

    document.getElementById("messageForm").addEventListener("submit", event => {
      if (typeof sendMessage === "function") sendMessage(event);
      else event.preventDefault();
    });
  </script>  <script src="./app.js"></script></body>
  </html>
