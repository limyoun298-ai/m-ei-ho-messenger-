<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b141a">
  <title>M-EI HO Messenger</title>

  <style>
    :root {
      --bg: #0b141a;
      --panel: #202c33;
      --card: #182229;
      --green: #25d366;
      --text: #e9edef;
      --muted: #8696a0;
      --border: #2a3942;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, sans-serif;
      min-height: 100dvh;
    }

    button, input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    #login-page {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 22px;
    }

    .auth-card {
      width: 100%;
      max-width: 390px;
      padding: 26px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 20px;
    }

    .logo {
      width: 68px;
      height: 68px;
      border-radius: 19px;
      background: var(--green);
      color: var(--bg);
      display: grid;
      place-items: center;
      font-size: 42px;
      font-weight: 900;
      margin: 0 auto 16px;
    }

    h1 {
      text-align: center;
      font-size: 25px;
      margin-bottom: 7px;
    }

    .subtitle {
      color: var(--muted);
      text-align: center;
      font-size: 13px;
      margin-bottom: 25px;
    }

    .field {
      display: block;
      width: 100%;
      margin-top: 13px;
      padding: 14px;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 11px;
      outline: none;
    }

    .field:focus {
      border-color: var(--green);
    }

    .primary {
      width: 100%;
      border: 0;
      background: var(--green);
      color: #062b1a;
      padding: 14px;
      border-radius: 11px;
      font-weight: 800;
      margin-top: 17px;
    }

    .secondary {
      width: 100%;
      padding: 12px;
      margin-top: 12px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 11px;
      color: var(--text);
    }

    #status {
      min-height: 20px;
      margin-top: 14px;
      font-size: 13px;
      text-align: center;
      color: var(--green);
      overflow-wrap: anywhere;
    }

    #app-page {
      height: 100dvh;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .topbar {
      height: 64px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 16px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
    }

    .mini-logo {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      background: var(--green);
      color: var(--bg);
      border-radius: 11px;
      font-weight: 900;
      font-size: 24px;
    }

    .brand {
      flex: 1;
      font-size: 19px;
      font-weight: 800;
    }

    .brand small {
      display: block;
      color: var(--muted);
      font-size: 11px;
      font-weight: 400;
    }

    .layout {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 310px minmax(0, 1fr);
    }

    .sidebar {
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      border-right: 1px solid var(--border);
    }

    .section-title {
      padding: 17px 16px 10px;
      font-weight: 800;
    }

    #search {
      margin: 0 12px 10px;
      width: calc(100% - 24px);
    }

    #chat-list {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
    }

    .empty {
      padding: 24px 16px;
      color: var(--muted);
      text-align: center;
      font-size: 13px;
      line-height: 1.6;
    }

    .chat-panel {
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      background:
        radial-gradient(
          circle at 50% 45%,
          #15252b 0,
          var(--bg) 70%
        );
    }

    .chat-header {
      min-height: 66px;
      padding: 10px 15px;
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
    }

    .avatar {
      width: 44px;
      height: 44px;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #29433a;
      color: var(--green);
      font-weight: 800;
    }

    .chat-heading {
      flex: 1;
      min-width: 0;
    }

    #chat-name {
      font-size: 15px;
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    #chat-status {
      font-size: 12px;
      color: var(--muted);
      margin-top: 3px;
    }

    #messages {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .welcome {
      margin: auto;
      max-width: 310px;
      text-align: center;
      color: var(--muted);
      line-height: 1.7;
      padding: 20px;
    }

    .welcome .logo {
      width: 76px;
      height: 76px;
      font-size: 46px;
    }

    .message-bar {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 11px;
      background: var(--panel);
      border-top: 1px solid var(--border);
    }

    #msg-input {
      min-width: 0;
      flex: 1;
      padding: 13px 16px;
      border: 1px solid var(--border);
      border-radius: 24px;
      background: #2a3942;
      color: var(--text);
      outline: none;
    }

    #send-btn {
      width: 46px;
      height: 46px;
      flex-shrink: 0;
      border: 0;
      border-radius: 50%;
      background: var(--green);
      color: #062b1a;
      font-size: 20px;
      font-weight: 900;
    }

    .verified {
      display: inline-grid;
      place-items: center;
      width: 15px;
      height: 15px;
      margin-left: 4px;
      border-radius: 50%;
      background: var(--green);
      color: #062b1a;
      font-size: 10px;
      vertical-align: middle;
    }

    .bottom-nav {
      display: none;
    }

    @media (max-width: 650px) {
      .topbar {
        height: 58px;
      }

      .layout {
        display: block;
        position: relative;
      }

      .sidebar {
        height: 100%;
        border-right: 0;
      }

      .chat-panel {
        display: none;
        position: absolute;
        inset: 0;
        z-index: 5;
      }

      .chat-panel.mobile-open {
        display: flex;
      }

      .bottom-nav {
        display: flex;
        flex-shrink: 0;
        height: calc(62px + env(safe-area-inset-bottom));
        padding-bottom: env(safe-area-inset-bottom);
        background: var(--panel);
        border-top: 1px solid var(--border);
      }

      .bottom-nav button {
        flex: 1;
        background: transparent;
        border: 0;
        color: var(--muted);
        font-size: 12px;
      }

      .bottom-nav button.active {
        color: var(--green);
      }

      .message-bar {
        padding-bottom: max(10px, env(safe-area-inset-bottom));
      }
    }
  </style>
</head>

<body>

  <!-- CONNEXION -->
  <section id="login-page">
    <div class="auth-card">
      <div class="logo">M</div>
      <h1 id="auth-title">M-EI HO</h1>
      <p class="subtitle">Messenger • Connecte-toi avec ton compte</p>

      <form id="login-form">
        <input
          id="phone"
          class="field"
          type="tel"
          placeholder="Numéro de téléphone"
          autocomplete="tel"
          required
        >

        <input
          id="password"
          class="field"
          type="password"
          placeholder="Mot de passe"
          autocomplete="current-password"
          required
        >

        <button class="primary" type="submit" id="login-btn">
          Se connecter
        </button>
      </form>

      <div id="register-card" class="hidden">
        <input
          id="reg-name"
          class="field"
          type="text"
          placeholder="Ton nom"
          autocomplete="name"
        >

        <input
          id="reg-phone"
          class="field"
          type="tel"
          placeholder="Numéro de téléphone"
          autocomplete="tel"
        >

        <input
          id="reg-pass"
          class="field"
          type="password"
          placeholder="Créer un mot de passe"
          autocomplete="new-password"
        >

        <button class="primary" id="register-btn" type="button">
          Créer mon compte
        </button>
      </div>

      <button class="secondary" id="switch-auth" type="button">
        Créer un nouveau compte
      </button>

      <p id="status" role="status" aria-live="polite"></p>
    </div>
  </section>

  <!-- APPLICATION -->
  <section id="app-page" class="hidden">
    <header class="topbar">
      <div class="mini-logo">M</div>
      <div class="brand">
        M-EI HO
        <small>Messenger</small>
      </div>
      <button
        id="logout-btn"
        type="button"
        style="background:transparent;border:0;color:#25d366;padding:10px"
      >
        Quitter
      </button>
    </header>

    <main class="layout">
      <aside class="sidebar">
        <div class="section-title">Discussions</div>

        <input
          id="search"
          class="field"
          type="search"
          placeholder="Rechercher un contact..."
          autocomplete="off"
        >

        <div id="chat-list">
          <div class="empty">
            Bienvenue sur M-EI HO.<br>
            Connecte-toi pour retrouver tes contacts.
          </div>
        </div>
      </aside>

      <section class="chat-panel" id="chat-panel">
        <header class="chat-header">
          <div class="avatar" id="chat-avatar">M</div>

          <div class="chat-heading">
            <div id="chat-name">M-EI HO Messenger</div>
            <div id="chat-status">Choisis un contact</div>
          </div>

          <button
            id="back-btn"
            type="button"
            style="display:none;background:transparent;border:0;color:#e9edef;font-size:22px"
            aria-label="Retour aux contacts"
          >
            ←
          </button>
        </header>

        <div id="messages" aria-live="polite">
          <div class="welcome">
            <div class="logo">M</div>
            <h2 style="margin-bottom:10px">M-EI HO Messenger</h2>
            <p>
              Tes discussions au même endroit.<br>
              Sélectionne un contact pour commencer.
            </p>
          </div>
        </div>

        <form class="message-bar" id="message-form">
          <input
            id="msg-input"
            type="text"
            placeholder="Écris un message..."
            autocomplete="off"
            maxlength="5000"
          >

          <button id="send-btn" type="submit" aria-label="Envoyer">
            ➤
          </button>
        </form>
      </section>
    </main>

    <nav class="bottom-nav">
      <button class="active" type="button" id="nav-chats">💬<br>Messages</button>
      <button type="button" id="nav-contacts">👥<br>Contacts</button>
      <button type="button" id="nav-profile">👤<br>Profil</button>
    </nav>
  </section>

  <!-- Le fonctionnement Supabase reste dans app.js -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./app.js"></script>

</body>
</html>
