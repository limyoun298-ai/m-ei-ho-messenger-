<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>M-EI HO</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a1014;color:#e9edef;font-family:-apple-system,Roboto,sans-serif;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
#splash{position:fixed;top:0;left:0;right:0;bottom:0;background:#0a1014;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity 0.6s}
#splash.hide{opacity:0;pointer-events:none}
.logo-big{width:120px;height:120px;background:#25d366;border-radius:32px;display:flex;align-items:center;justify-content:center;font-size:72px;font-weight:900;color:#0a1014;box-shadow:0 8px 30px rgba(37,211,102,0.4)}
.logo-text{margin-top:20px;font-size:28px;font-weight:800}
.logo-sub{margin-top:8px;color:#8696a0;font-size:14px}
.header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#0a1014}
.header h1{font-size:24px;font-weight:800;display:flex;align-items:center;gap:10px}
.header h1 .mini-logo{width:32px;height:32px;background:#25d366;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900;color:#0a1014}
.search{background:#202c33;margin:0 12px;border-radius:28px;padding:12px 16px;display:flex;gap:10px;align-items:center}
.search input{background:transparent;border:none;color:white;width:100%;font-size:15px;outline:none}
.filters{display:flex;gap:8px;padding:10px 12px;overflow-x:auto;white-space:nowrap}
.pill{padding:7px 14px;border-radius:20px;background:#202c33;color:#8696a0;font-size:13px;border:1px solid #2a3942;flex-shrink:0}
.pill.active{background:#0a332c;color:#25d366;border-color:#0a332c;font-weight:600}
.content{flex:1;overflow-y:auto;display:none;background:#111b21;padding-bottom:85px}
.content.active{display:block}
.chat-row{display:flex;padding:12px 16px;gap:12px;align-items:center}
.avatar{width:52px;height:52px;border-radius:50%;background:#2a3942;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.name{font-weight:500;font-size:16px}
.verified-meiho{width:18px;height:18px;background:#25d366;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;color:#0a1014;font-weight:bold}
.last{color:#8696a0;font-size:14px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{margin-left:auto;text-align:right;display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.time{font-size:12px;color:#8696a0}
.badge-green{background:#25d366;color:#0a1014;font-size:12px;font-weight:700;padding:2px 8px;border-radius:12px}
.check-meiho{color:#25d366;font-size:12px;font-weight:bold}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#0a1014;display:flex;justify-content:space-around;padding:8px 0 12px;border-top:1px solid #1f2c34;z-index:100}
.nav{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1;color:#8696a0;cursor:pointer}
.nav.active{color:#e9edef}
.nav .ic-wrap{padding:4px 18px;border-radius:20px;display:flex;align-items:center;justify-content:center;position:relative}
.nav.active .ic-wrap{background:#1a332e}
.ic{font-size:24px}
.badge-nav{position:absolute;top:-2px;right:8px;background:#25d366;color:#0a1014;font-size:11px;font-weight:700;padding:1px 5px;border-radius:10px}
.nav-label{font-size:12px;font-weight:500}
.fab{position:fixed;bottom:90px;right:16px;width:56px;height:56px;background:#25d366;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:26px;color:#0a1014;z-index:90}
.status-scroll{display:flex;gap:10px;padding:12px;overflow-x:auto}
.status-card{width:110px;height:160px;border-radius:16px;background:#202c33;flex-shrink:0;position:relative;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;border:1px solid #2a3942}
.status-card.add{align-items:center;justify-content:center;gap:20px;border:1px dashed #2a3942}
.status-avatar{width:38px;height:38px;border-radius:50%;border:3px solid #25d366;position:absolute;top:8px;left:8px;background:#2a3942;display:flex;align-items:center;justify-content:center}
.status-name{font-size:13px;font-weight:500}
@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="splash"><div class="logo-big">M</div><div class="logo-text">M-EI HO</div><div class="logo-sub">Messagerie mondiale</div><div style="margin-top:40px;width:40px;height:40px;border:3px solid #202c33;border-top:3px solid #25d366;border-radius:50%;animation:spin 1s linear infinite"></div></div>
<div class="header" id="mainHeader"><h1><span class="mini-logo">M</span> M-EI HO</h1><div style="display:flex;gap:20px;font-size:22px">📷 ⋮</div></div>
