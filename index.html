<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>M-EI HO FIX</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>:root{--bg:#0b141a;--bar:#202c33;--page:#111b21;--muted:#8696a0;--green:#25D366;--sent:#005c4b}*{box-sizing:border-box;margin:0;padding:0}body{height:100dvh;background:var(--bg);color:#e9edef;font-family:system-ui;display:flex;flex-direction:column}#splash{position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;align-items:center;justify-content:center;flex-direction:column;transition:.4s}#splash.hide{opacity:0;pointer-events:none}.bigM{width:120px;height:120px;border-radius:28px;background:var(--green);display:grid;place-items:center;color:#0b141a;font-size:74px;font-weight:900}header{height:60px;background:var(--bar);display:flex;align-items:center;justify-content:space-between;padding:0 15px}.page{display:none;flex:1;overflow:auto;background:var(--page);padding-bottom:90px}.page.active{display:block}.row{display:flex;gap:12px;padding:12px 15px;border-bottom:1px solid #222f35}.ava{width:50px;height:50px;border-radius:50%;background:#2a3942;display:grid;place-items:center;font-weight:800;overflow:hidden}.ava img{width:100%;height:100%;object-fit:cover}.meta-check{width:14px;height:14px;background:#25D366;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;margin-left:5px}.meta-check span{color:#fff;font-size:9px;font-weight:900}.bottom{position:fixed;bottom:0;left:0;right:0;height:74px;background:var(--bar);display:flex}.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);font-size:11px}.tab.active{color:#fff}.field{width:100%;margin-top:9px;padding:14px;background:var(--bar);border:1px solid #2a3942;border-radius:12px;color:#fff}.btn{width:100%;margin-top:12px;padding:14px;border:0;border-radius:12px;background:var(--green);color:#0b141a;font-weight:800}#chat{position:fixed;inset:0;background:var(--page);z-index:20;display:none;flex-direction:column}#chat.open{display:flex}.bubble{max-width:78%;padding:9px 12px;border-radius:10px;margin:4px 0}.bubble.me{align-self:flex-end;background:var(--sent)}.bubble.other{align-self:flex-start;background:var(--bar)}.fab{position:fixed;right:18px;bottom:92px;width:56px;height:56px;background:var(--green);border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:26px;color:#0b141a}</style></head><body>
<div id="splash"><div class="bigM">M</div><div style="margin-top:18px;font-weight:800;font-size:26px">M-EI HO</div><div style="color:var(--muted);margin-top:6px">v2.26.41.5 FIX • REAL</div></div>
<header><div style="display:flex;gap:10px;align-items:center"><div style="width:36px;height:36px;background:var(--green);border-radius:9px;display:grid;place-items:center;color:#0b141a;font-weight:900">M</div><b>M-EI HO REAL</b></div></header>
<div id="pAuth" class="page active" style="padding:24px"><div class="bigM" style="margin:20px auto">M</div><h2 style="text-align:center">Connexion Réelle</h2><input id="loginName" class="field" placeholder="Ton nom"><input id="loginPhone" class="field" type="tel" placeholder="+243..."><button class="btn" onclick="realLogin()">Se connecter</button><div id="status" style="margin-top:12px;text-align:center;color:var(--green)"></div><div id="err" style="margin-top:12px;color:#ff6b6b;text-align:center;font-size:12px"></div></div>
<div id="pChats" class="page"><div id="chatList"></div><div class="fab" onclick="addRealContact()">✎</div></div>
<div id="pActus" class="page"><div style="padding:16px"><h3>Actus</h3><input id="chName" class="field" placeholder="Nom chaîne"><button class="btn" onclick="createChannel()">Créer</button><div id="channelList"></div></div></div><div id="pComm" class="page"><div style="padding:16px">Communauté</div></div><div id="pCalls" class="page"><div style="padding:16px">Appels</div></div>
<div id="pSettings" class="page"><div style="padding:16px"><div id="myProfile"></div><button class="btn" style="background:var(--bar);color:#fff;margin-top:20px" onclick="localStorage.clear();location.reload()">Déconnexion</button></div></div>
<div class="bottom"><div class="tab active" onclick="go('pChats',this)">Discussions</div><div class="tab" onclick="go('pActus',this)">Actus</div><div class="tab" onclick="go('pComm',this)">Communauté</div><div class="tab" onclick="go('pCalls',this)">Appels</div></div>
<div id="chat"><div style="height:60px;background:var(--bar);display:flex;align-items:center;gap:10px;padding:0 12px"><span onclick="closeChat()">←</span><div class="ava" id="chatAva">M</div><div id="chatName" style="font-weight:700"></div></div><div id="msgs" style="flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column"></div><div id="realBar" style="display:flex;gap:8px;padding:8px;background:var(--bar)"><input id="inp" placeholder="Message" style="flex:1;background:#111b21;border:none;border-radius:22px;padding:12px;color:#fff"><button onclick="sendReal()" style="width:46px;height:46px;background:var(--green);border-radius:50%;border:0">➤</button></div><div id="officialBar" style="display:none;padding:14px;background:var(--bar);text-align:center">🔒 Lecture seule</div></div>
<script>
const SUPA_URL='https://ooxnwsgzpnqdguapfffp.supabase.co';const SUPA_KEY='sb_publishable__WGct3XmHpVBY1B4X2PdXg_KpJ74Nlp';
let supa;try{supa=supabase.createClient(SUPA_URL,SUPA_KEY)}catch(e){document.getElementById('err').textContent='Supabase init error: '+e.message}
let me=null,cur=null;const verified=["M-EI HO Official"];function badge(){return '<span class="meta-check"><span>✓</span></span>'}
setTimeout(()=>splash.classList.add('hide'),1200);
async function realLogin(){
 try{
 let name=loginName.value.trim();let phone=loginPhone.value.trim();
 if(!name||!phone){alert('Entre nom +243');return}
 status.textContent='Connexion Supabase en cours...';err.textContent='';
 let {data,error:selErr}=await supa.from('profiles').select('*').eq('phone',phone).maybeSingle();
 if(selErr) throw selErr;
 if(!data){
  let {data:newP,error:insErr}=await supa.from('profiles').insert({phone,name,bio:'Disponible'}).select().single();
  if(insErr) throw insErr;
  data=newP;
 }
 me=data;localStorage.setItem('meiho-me',JSON.stringify(me));
 pAuth.classList.remove('active');pChats.classList.add('active');loadChats();
 supa.channel('rt').on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},p=>{if(p.new.receiver_phone===me.phone||p.new.sender_phone===me.phone)loadMsgs()}).subscribe();
 status.textContent='Connecté ✓ '+me.name;
 }catch(e){err.textContent='ERREUR: '+e.message;status.textContent='Echec';console.error(e);alert('Erreur Supabase: '+e.message+'\n\nVa dans Supabase Dashboard > Authentication > Policies > Mets RLS ALLOW ALL pour profiles et messages')}
}
async function loadChats(){let {data,error}=await supa.from('profiles').select('*').neq('phone',me.phone);if(error){err.textContent=error.message;return}let html=`<div class=row onclick="openOfficial()"><div class=ava style="background:var(--green);color:#0b141a">M</div><div><b>M-EI HO Official ${badge()}</b></div></div>`;(data||[]).forEach(p=>{html+=`<div class=row onclick="openReal('${p.phone}','${p.name}')"><div class=ava>${p.name[0]}</div><div><b>${p.name}</b><div style=color:var(--muted)>${p.phone}</div></div></div>`});chatList.innerHTML=html}
function openOfficial(){cur='official';chat.classList.add('open');chatName.innerHTML='M-EI HO Official '+badge();msgs.innerHTML='<div class=bubble other>Officiel lecture seule</div>';realBar.style.display='none';officialBar.style.display='block'}
async function openReal(ph,na){cur=ph;chat.classList.add('open');chatName.textContent=na;realBar.style.display='flex';officialBar.style.display='none';loadMsgs()}
async function loadMsgs(){if(!cur||cur==='official')return;let {data}=await supa.from('messages').select('*').or(`and(sender_phone.eq.${me.phone},receiver_phone.eq.${cur}),and(sender_phone.eq.${cur},receiver_phone.eq.${me.phone})`).order('created_at',{ascending:true});msgs.innerHTML='';(data||[]).forEach(m=>{let d=document.createElement('div');d.className='bubble '+(m.sender_phone===me.phone?'me':'other');d.textContent=m.text;msgs.appendChild(d)});msgs.scrollTop=msgs.scrollHeight}
async function sendReal(){let t=inp.value.trim();if(!t||!cur||cur==='official')return;await supa.from('messages').insert({sender_phone:me.phone,receiver_phone:cur,text:t});inp.value='';loadMsgs()}
function closeChat(){chat.classList.remove('open')}function go(id,el){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));el.classList.add('active')}
async function addRealContact(){let p=prompt('+243:');if(!p)return;let {data}=await supa.from('profiles').select('*').eq('phone',p).maybeSingle();if(!data){alert('Pas encore inscrit');return}loadChats()}function createChannel(){let n=chName.value.trim();if(!n)return;channelList.innerHTML+=`<div class=row><div class=ava>${n[0]}</div><div><b>${n}</b></div></div>`}
let saved=localStorage.getItem('meiho-me');if(saved){me=JSON.parse(saved);pAuth.classList.remove('active');pChats.classList.add('active');loadChats()}
</script></body></html>
